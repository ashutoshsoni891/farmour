name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.11.29" }
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Module boundaries (import-linter)
        run: uv run lint-imports
      - name: Types (mypy strict)
        run: uv run mypy --strict app tests conftest.py
      - name: Security lint (bandit)
        run: uv run bandit -q -r app -c pyproject.toml -ll
      - name: Dependency audit (pip-audit)
        run: uv export --frozen --no-dev --no-hashes -o /tmp/req.txt && uv run pip-audit -r /tmp/req.txt --strict
      - name: API contract is committed
        run: uv run python -m scripts.export_openapi && git diff --exit-code openapi.json
      - name: Tests (unit + integration with Postgres/PostGIS/pgvector in Docker)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=75

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version-file: frontend/.nvmrc, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated API types match the contract
        run: pnpm api:types && git diff --exit-code src/api/schema.d.ts
      - run: pnpm audit --audit-level high --prod
      - run: pnpm exec playwright install --with-deps chromium && pnpm e2e

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Filesystem scan (Trivy)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
