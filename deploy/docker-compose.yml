# One file for local, staging and prod; each environment has its own .env (spec section 4).
# Only Caddy publishes ports; every other service is reachable only on the compose network.
name: farm

x-app-env: &app-env
  ENV: ${ENV:-local}
  APP_BASE_URL: ${APP_BASE_URL}
  CORS_ORIGINS: '["${APP_BASE_URL}"]'
  DATABASE_URL: postgresql+asyncpg://farm:${POSTGRES_PASSWORD}@postgres:5432/farm
  VALKEY_URL: redis://valkey:6379/0
  KEYCLOAK_URL: http://keycloak:8080/auth
  KEYCLOAK_PUBLIC_URL: ${APP_BASE_URL}/auth
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-farm}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-farm-web}
  LINK_SIGNING_SECRET: ${LINK_SIGNING_SECRET}
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-farm-files}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}

x-app: &app
  image: ${IMAGE_PREFIX:-farm}/api:${IMAGE_TAG:-dev}
  build: ../backend
  environment: *app-env
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  postgres:
    image: ${IMAGE_PREFIX:-farm}/postgres:${IMAGE_TAG:-dev}
    build: ./postgres
    environment:
      POSTGRES_USER: farm
      POSTGRES_DB: farm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      FARM_RO_PASSWORD: ${FARM_RO_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm -d farm"]
      interval: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 1g } } }
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.2-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    read_only: true
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 256m } } }
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/entrypoint-farm.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - s3data:/data
      - ./seaweedfs/entrypoint.sh:/entrypoint-farm.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 512m } } }
    restart: unless-stopped

  storage-init:
    image: chrislusf/seaweedfs:4.48
    depends_on: { seaweedfs: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 's3.bucket.create -name ${S3_BUCKET:-farm-files}' | weed shell -master=seaweedfs:9333"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start", "--import-realm", "--optimized=false"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${APP_BASE_URL}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
    volumes:
      - ./keycloak/realm-farm.json:/opt/keycloak/data/import/realm-farm.json:ro
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      retries: 30
    deploy: { resources: { limits: { memory: 1g } } }
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      retries: 10
    deploy: { resources: { limits: { memory: 512m } } }

  worker:
    <<: *app
    command: ["celery", "-A", "app.jobs.celery_app:celery", "worker", "-Q", "default,messaging,ai", "--concurrency", "2"]
    depends_on: { api: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 512m } } }

  beat:
    <<: *app
    command: ["celery", "-A", "app.jobs.celery_app:celery", "beat", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on: { api: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 256m } } }

  caddy:
    image: ${IMAGE_PREFIX:-farm}/web:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${APP_BASE_URL}/auth
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on:
      api: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 256m } } }
    restart: unless-stopped

volumes:
  pgdata: {}
  s3data: {}
  caddy_data: {}
  caddy_config: {}
